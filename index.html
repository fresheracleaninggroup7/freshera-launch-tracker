<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freshera Cleaners - Launch Progress Form</title>
  <style>
    :root {
      --page: #eef4ef;
      --card: #ffffff;
      --ink: #202124;
      --muted: #5f6f64;
      --line: #d8e2da;
      --soft-line: #edf1ee;
      --green: #16834a;
      --green-dark: #0f6638;
      --green-soft: #e5f6eb;
      --amber: #9a5a00;
      --amber-soft: #fff5dc;
      --blue: #1a73e8;
      --danger: #b3261e;
      --shadow: 0 2px 8px rgba(60, 64, 67, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Roboto, Inter, Arial, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .wrap {
      width: min(860px, calc(100% - 24px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .form-title,
    .panel,
    .section,
    .notice {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .form-title {
      overflow: hidden;
      margin-bottom: 12px;
    }

    .top-line {
      height: 10px;
      background: var(--green);
    }

    .title-body {
      padding: 28px 30px 24px;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .title-copy {
      min-width: 0;
    }

    .tag {
      margin: 0 0 10px;
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 12px;
      padding: 18px 20px;
    }

    .progress-text {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 700;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf1ee;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--green);
      transition: width 180ms ease;
    }

    .percent {
      min-width: 86px;
      text-align: right;
      color: var(--green);
      font-size: 32px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 14px;
    }

    .button {
      min-height: 40px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    .button:hover,
    .button.active {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green-dark);
    }

    .button.primary {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
      font-weight: 700;
    }

    .button.danger:hover {
      border-color: var(--danger);
      background: #fceeee;
      color: var(--danger);
    }

    .button.small {
      min-height: 34px;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .admin-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--green-dark);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .admin-toggle:hover,
    .admin-toggle.active {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green-dark);
    }

    .select-control {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      gap: 8px;
      padding: 7px 9px 7px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .select-control select {
      max-width: min(220px, 52vw);
      border: 0;
      background: transparent;
      color: var(--ink);
      font-weight: 700;
      outline: 0;
    }

    .admin-panel {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: -4px 0 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8faf8;
    }

    .admin-panel.show {
      display: flex;
    }

    .admin-state {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .notice {
      display: none;
      margin-bottom: 12px;
      padding: 12px 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .notice.show {
      display: block;
    }

    .section {
      margin-bottom: 12px;
      overflow: hidden;
    }

    .section-head {
      display: flex;
      width: 100%;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .section.collapsed .section-head {
      border-bottom: 0;
    }

    .section-head:hover {
      background: #fbfdfb;
    }

    .section-title-line {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
    }

    .section-chevron {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      margin-top: -3px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(45deg);
      transition: transform 160ms ease, margin 160ms ease;
    }

    .section.collapsed .section-chevron {
      margin-top: 0;
      transform: rotate(-45deg);
    }

    .section-tasks {
      display: block;
    }

    .section.collapsed .section-tasks {
      display: none;
    }

    h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .section-note {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .section-count {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--amber-soft);
      color: var(--amber);
      font-size: 13px;
      font-weight: 700;
    }

    .section.done .section-count {
      background: var(--green-soft);
      color: var(--green-dark);
    }

    .question {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 16px 22px;
      border-bottom: 1px solid var(--soft-line);
      background: #fff;
    }

    .question:last-child {
      border-bottom: 0;
    }

    .question.complete {
      background: var(--green-soft);
    }

    .box {
      position: relative;
      width: 24px;
      height: 24px;
      margin-top: 2px;
      border: 2px solid #9aa9a0;
      border-radius: 4px;
      background: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .box input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .box.readonly,
    .box.readonly input {
      cursor: default;
    }

    .tick {
      display: none;
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      line-height: 1;
    }

    .question.complete .box {
      border-color: var(--green);
      background: var(--green);
    }

    .question.complete .tick {
      display: block;
    }

    .q-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
    }

    .q-note {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .q-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .q-detail {
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--soft-line);
      border-radius: 6px;
      background: #f8faf8;
    }

    .question.complete .q-detail {
      border-color: #cce8d5;
      background: rgba(255, 255, 255, 0.72);
    }

    .q-detail-label,
    .q-detail-value {
      display: block;
      overflow-wrap: anywhere;
    }

    .q-detail-label {
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .q-detail-value {
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }

    .q-detail-value strong {
      font-weight: 800;
    }

    .q-images {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .q-image-link {
      display: block;
      overflow: hidden;
      border: 1px solid var(--soft-line);
      border-radius: 6px;
      background: #fff;
    }

    .q-image-link:hover {
      border-color: var(--green);
    }

    .q-image-link img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }

    .q-detail.priority .q-detail-value {
      font-weight: 800;
    }

    .q-detail.priority-high {
      border-color: #f1b8b3;
      background: #fff1f0;
    }

    .q-detail.priority-high .q-detail-label,
    .q-detail.priority-high .q-detail-value {
      color: var(--danger);
    }

    .q-detail.priority-medium {
      border-color: #f4cf86;
      background: var(--amber-soft);
    }

    .q-detail.priority-medium .q-detail-label,
    .q-detail.priority-medium .q-detail-value {
      color: var(--amber);
    }

    .q-detail.priority-low {
      border-color: #cce8d5;
      background: var(--green-soft);
    }

    .q-detail.priority-low .q-detail-label,
    .q-detail.priority-low .q-detail-value {
      color: var(--green-dark);
    }

    .question.priority-high {
      box-shadow: inset 4px 0 0 var(--danger);
    }

    .doc-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      margin-top: 9px;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .doc-button.active {
      background: #e8f0fe;
      color: var(--blue);
    }

    .doc-button.disabled {
      background: #eef1ef;
      color: #8b948f;
      cursor: not-allowed;
      text-decoration: none;
    }

    .edit-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--green-dark);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .edit-button:hover {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green-dark);
      text-decoration: none;
    }

    .edit-row {
      grid-column: 2 / -1;
      display: flex;
      padding-top: 2px;
    }

    .status {
      min-width: 82px;
      padding: 6px 9px;
      border-radius: 999px;
      background: #f1f3f2;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status.inprogress {
      background: #e8f0fe;
      color: var(--blue);
    }

    .status.waitingfordocument {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .status.blocked {
      background: #fceeee;
      color: var(--danger);
    }

    .question.complete .status {
      background: var(--green);
      color: #fff;
    }

    .hidden {
      display: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 11px 15px;
      border-radius: 8px;
      background: #202124;
      color: #fff;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, bottom 160ms ease;
    }

    .toast.show {
      bottom: 28px;
      opacity: 1;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(32, 33, 36, 0.48);
    }

    .modal.hidden {
      display: none;
    }

    .modal-box {
      width: min(720px, 100%);
      max-height: min(88vh, 820px);
      overflow: auto;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 38px rgba(32, 33, 36, 0.22);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .modal-head h3 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }

    .modal-body {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 18px 20px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.wide {
      grid-column: 1 / -1;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 40px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    .field textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.45;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 20px 18px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 680px) {
      .wrap {
        width: min(100% - 18px, 860px);
        padding-top: 12px;
      }

      .title-body {
        padding: 22px 20px;
      }

      .title-row {
        display: grid;
        gap: 14px;
      }

      .admin-toggle {
        width: fit-content;
      }

      h1 {
        font-size: 27px;
      }

      .panel {
        grid-template-columns: 1fr;
      }

      .percent {
        text-align: left;
      }

      .question {
        grid-template-columns: 32px minmax(0, 1fr);
      }

      .status {
        grid-column: 2;
        width: fit-content;
      }

      .edit-row {
        grid-column: 2;
        padding-top: 0;
      }

      .section-head {
        padding: 16px 18px;
      }

      .modal-body {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="form-title">
      <div class="top-line"></div>
      <div class="title-body">
        <div class="title-row">
          <div class="title-copy">
            <p class="tag">Freshera Cleaners internal tracker</p>
            <h1>Launch progress checklist</h1>
          </div>
          <button class="admin-toggle" id="adminToggle" type="button">Admin edit</button>
        </div>
      </div>
    </div>

    <div class="panel" aria-live="polite">
      <div>
        <p class="progress-text" id="progressCount">Loading progress...</p>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
      <div class="percent" id="progressText">0%</div>
    </div>

    <div class="actions" aria-label="Checklist controls">
      <button class="button active" data-filter="all" type="button">All</button>
      <button class="button" data-filter="pending" type="button">Pending</button>
      <button class="button" data-filter="complete" type="button">Complete</button>
      <label class="select-control">
        <span>Priority</span>
        <select id="priorityFilter" aria-label="Filter by priority">
          <option value="">All priorities</option>
        </select>
      </label>
      <label class="select-control">
        <span>Assigned To</span>
        <select id="assignedFilter" aria-label="Filter by assigned person">
          <option value="">Everyone</option>
        </select>
      </label>
      <button class="button" id="refreshData" type="button">Refresh</button>
      <button class="button danger" id="resetAll" type="button">Reset</button>
    </div>

    <div class="admin-panel" id="adminPanel" aria-label="Admin editing controls">
      <button class="button primary small" id="addTask" type="button">Add task</button>
      <button class="button small" id="addSection" type="button">Add section</button>
      <button class="button small" id="addColumn" type="button">Add column</button>
      <span class="admin-state" id="adminState">Admin editing is on.</span>
    </div>

    <div class="notice" id="notice"></div>
    <div id="sections"></div>
  </main>

  <div class="toast" id="toast">Copied</div>

  <div class="modal hidden" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="modal-box">
      <form id="editForm">
        <div class="modal-head">
          <h3 id="editTitle">Edit task</h3>
          <button class="button small" id="closeEdit" type="button">Close</button>
        </div>
        <div class="modal-body" id="editFields"></div>
        <div class="modal-actions">
          <button class="button" id="cancelEdit" type="button">Cancel</button>
          <button class="button primary" id="saveEdit" type="submit">Save changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const FALLBACK_ROWS = [
      ["Business foundation", "Company profile / statement", "Short company profile for vendor panel use.", "Pending", ""],
      ["Business foundation", "ABN / ACN evidence", "Attach official business registration proof.", "Pending", ""],
      ["Business foundation", "Business name confirmation", "Confirm the official Freshera Cleaners business name.", "Pending", ""],
      ["Business foundation", "Public liability certificate", "Collect the current certificate of currency.", "Pending", ""],
      ["Business foundation", "Workers compensation decision", "Confirm whether workers compensation insurance is required.", "Pending", ""],
      ["Compliance documents", "WHS policy", "Work health and safety rules and responsibilities.", "Pending", ""],
      ["Compliance documents", "Environmental policy", "Waste, water, chemical use, and environmental commitment.", "Pending", ""],
      ["Compliance documents", "Quality policy", "Quality control standards and review process.", "Pending", ""],
      ["Compliance documents", "Chemical handling procedure", "SDS, PPE, storage, dilution, and spill response process.", "Pending", ""],
      ["Compliance documents", "Safety data sheet register", "SDS links or files for every chemical used.", "Pending", ""],
      ["Compliance documents", "Safe work method statement", "Site-specific SWMS where required.", "Pending", ""],
      ["Compliance documents", "Incident reporting procedure", "Incident reporting, escalation, and evidence process.", "Pending", ""],
      ["Compliance documents", "Business continuity plan", "Emergency, absence, and service disruption plan.", "Pending", ""],
      ["Staff readiness", "Staff induction procedure", "New staff onboarding and sign-off process.", "Pending", ""],
      ["Staff readiness", "Staff qualifications / checks", "Police checks, right-to-work checks, and training records.", "Pending", ""],
      ["Staff readiness", "Referees list", "References for vendor applications.", "Pending", ""],
      ["Staff readiness", "Organization chart", "Director, supervisor, cleaners, and admin roles.", "Pending", ""],
      ["Quality control", "Digital cleaning checklist", "Daily or site-based task checklist.", "Pending", ""],
      ["Quality control", "Photo evidence", "Before/after photos and issue evidence.", "Pending", ""],
      ["Quality control", "Task completion tracking", "Clear record showing whether each job has been completed.", "Pending", ""],
      ["Quality control", "Supervisor reviews", "Regular quality checks and supervisor sign-off.", "Pending", ""],
      ["Quality control", "QR / site attendance", "Site attendance proof for staff.", "Pending", ""],
      ["Quality control", "Complaint tracking", "Complaint record, response, and close-out proof.", "Pending", ""],
      ["Quality control", "Monthly quality report", "Monthly summary for improvement and vendor evidence.", "Pending", ""],
      ["Vendor panel and web content", "Vendor panel profile pack", "Policies, insurance, company profile, referees, and quality evidence.", "Pending", ""],
      ["Vendor panel and web content", "Google Drive folder structure", "Organize all documents section by section.", "Pending", ""],
      ["Vendor panel and web content", "Website content planning", "Plan public website content separately.", "Pending", ""],
      ["Vendor panel and web content", "Staff progress link share", "Share the latest tracker page link with the team.", "Pending", ""]
    ];

    const STORAGE_KEY = "freshera-form-checklist-v2";
    const ADMIN_KEY_STORAGE = "freshera-admin-key-v1";
    const COLLAPSED_SECTIONS_STORAGE = "freshera-collapsed-sections-v1";
    const DEFAULT_HEADERS = ["Section", "Task", "Note", "Status", "Document Link", "Link Label", "Assigned To", "Notes", "Priority"];
    const params = new URLSearchParams(location.search);
    const sheetId = params.get("sheet") || "1Jq62ilXsDWa-CLU5CSFjwsVqU7HkBbqOL0P94k6X3XA";
    const sheetTab = params.get("tab") || "Sheet1";
    const sheetApiUrl = params.get("api") || "https://script.google.com/macros/s/AKfycbxs5sVT_4y6KzSt4kjQ24gbzsb6Ohlcv57nhHQPOmZAmaOWXwL2w8Ztphw7wfUMWWFs/exec";
    const usingSheet = Boolean(sheetId);

    const sectionsEl = document.getElementById("sections");
    const progressText = document.getElementById("progressText");
    const progressCount = document.getElementById("progressCount");
    const progressBar = document.getElementById("progressBar");
    const notice = document.getElementById("notice");
    const toast = document.getElementById("toast");
    const resetButton = document.getElementById("resetAll");
    const priorityFilterEl = document.getElementById("priorityFilter");
    const assignedFilterEl = document.getElementById("assignedFilter");
    const adminToggle = document.getElementById("adminToggle");
    const adminPanel = document.getElementById("adminPanel");
    const adminState = document.getElementById("adminState");
    const editModal = document.getElementById("editModal");
    const editForm = document.getElementById("editForm");
    const editTitle = document.getElementById("editTitle");
    const editFields = document.getElementById("editFields");
    let filter = "all";
    let priorityFilter = "";
    let assignedFilter = "";
    let rows = rowsToItems(FALLBACK_ROWS);
    let localState = readLocalState();
    let currentHeaders = DEFAULT_HEADERS.slice();
    let adminKey = sessionStorage.getItem(ADMIN_KEY_STORAGE) || "";
    let adminMode = Boolean(adminKey);
    let editingItem = null;
    let collapsedSections = readCollapsedSections();

    function normalize(value) {
      return String(value || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "");
    }

    function isComplete(value) {
      const clean = normalize(value);
      return ["complete", "completed", "done", "yes", "true", "tick", "checked", "1"].includes(clean);
    }

    function readLocalState() {
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      const fromLink = hash.get("done");
      if (fromLink !== null) {
        return Object.fromEntries(fromLink.split(",").filter(Boolean).map(id => [id, true]));
      }
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function saveLocalState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(localState));
    }

    function readCollapsedSections() {
      try {
        return JSON.parse(localStorage.getItem(COLLAPSED_SECTIONS_STORAGE) || "{}");
      } catch {
        return {};
      }
    }

    function saveCollapsedSections() {
      localStorage.setItem(COLLAPSED_SECTIONS_STORAGE, JSON.stringify(collapsedSections));
    }

    function sectionKey(name) {
      return normalize(name) || String(name || "");
    }

    function isSectionCollapsed(key) {
      if (Object.prototype.hasOwnProperty.call(collapsedSections, key)) {
        return Boolean(collapsedSections[key]);
      }
      return true;
    }

    function makeId(section, task, index) {
      const base = normalize(section + "-" + task).slice(0, 80);
      return base || "task-" + index;
    }

    function rowsToItems(rawRows) {
      return rawRows
        .map((row, index) => {
          const source = Array.isArray(row) ? {
            section: row[0],
            task: row[1],
            note: row[2],
            status: row[3],
            link: row[4],
            linkLabel: row[5],
            extras: [],
            values: DEFAULT_HEADERS.map((_header, columnIndex) => row[columnIndex] || "")
          } : row;
          const section = String(source.section || "General").trim();
          const task = String(source.task || "").trim();
          if (!task) return null;
          const note = String(source.note || "").trim();
          const status = String(source.status || "").trim();
          const link = String(source.link || "").trim();
          const linkLabel = String(source.linkLabel || "View document").trim() || "View document";
          const statusLabel = status || "Pending";
          const extras = Array.isArray(source.extras) ? source.extras
            .map(extra => ({
              label: String(extra.label || "").trim(),
              value: String(extra.value || "").trim()
            }))
            .filter(extra => extra.label && extra.value) : [];
          return {
            id: makeId(section, task, index),
            section,
            task,
            note,
            complete: isComplete(status),
            status: isComplete(status) ? "Complete" : statusLabel,
            link,
            linkLabel,
            extras,
            sheetRow: Number(source.sheetRow || 0),
            values: Array.isArray(source.values) ? source.values : []
          };
        })
        .filter(Boolean);
    }

    function groupRows(items) {
      const groups = [];
      const byName = new Map();
      items.forEach(item => {
        if (!byName.has(item.section)) {
          const group = { name: item.section, tasks: [] };
          byName.set(item.section, group);
          groups.push(group);
        }
        byName.get(item.section).tasks.push(item);
      });
      return groups;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeUrl(value) {
      try {
        const url = new URL(value);
        if (url.protocol === "https:" || url.protocol === "http:") return url.toString();
      } catch {}
      return "";
    }

    function escapeRegExp(value) {
      return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function phoneHref(value) {
      const digits = String(value).replace(/[^\d+]/g, "");
      const plainDigits = digits.replace(/\D/g, "");
      if (plainDigits.length < 8) return "";
      return "tel:" + digits;
    }

    function extractUrls(value) {
      const matches = String(value || "").match(/https?:\/\/[^\s<>()]+/g) || [];
      return matches.map(url => url.replace(/[.,;:!?]+$/, ""));
    }

    function driveFileId(url) {
      const direct = url.match(/\/file\/d\/([^/?#]+)/);
      if (direct) return direct[1];
      try {
        const parsed = new URL(url);
        return parsed.searchParams.get("id") || "";
      } catch {
        return "";
      }
    }

    function imagePreviewUrl(value) {
      const url = safeUrl(value);
      if (!url) return "";
      try {
        const parsed = new URL(url);
        if (/\.(png|jpe?g|webp|gif)(\?.*)?$/i.test(parsed.pathname + parsed.search)) return url;
        if (parsed.hostname.includes("drive.google.com")) {
          const id = driveFileId(url);
          if (id) return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w1000";
        }
        if (parsed.hostname.includes("googleusercontent.com")) return url;
      } catch {}
      return "";
    }

    function renderImagePreviews(value, label) {
      const images = extractUrls(value)
        .map(url => ({ href: safeUrl(url), src: imagePreviewUrl(url) }))
        .filter(image => image.href && image.src);
      if (!images.length) return "";
      return `
        <span class="q-images">
          ${images.map((image, index) => `
            <a class="q-image-link" href="${image.href}" target="_blank" rel="noopener">
              <img src="${image.src}" alt="${escapeHtml(label)} screenshot ${index + 1}" loading="lazy">
            </a>
          `).join("")}
        </span>
      `;
    }

    function formatDetailValue(value) {
      const text = String(value || "");
      const tokens = [];
      const tokenPattern = /(https?:\/\/[^\s<>()]+|(?:\+?\d[\d\s().-]{7,}\d))/g;
      let cursor = 0;
      let match;
      while ((match = tokenPattern.exec(text))) {
        if (match.index > cursor) tokens.push({ type: "text", value: text.slice(cursor, match.index) });
        const raw = match[0].replace(/[.,;:!?]+$/, "");
        const trailing = match[0].slice(raw.length);
        const url = safeUrl(raw);
        tokens.push(url ? { type: "url", value: raw, href: url } : { type: "phone", value: raw, href: phoneHref(raw) });
        if (trailing) tokens.push({ type: "text", value: trailing });
        cursor = match.index + match[0].length;
      }
      if (cursor < text.length) tokens.push({ type: "text", value: text.slice(cursor) });

      return tokens.map(token => {
        if (token.type === "url") {
          return `<a href="${token.href}" target="_blank" rel="noopener">${escapeHtml(token.value)}</a>`;
        }
        if (token.type === "phone" && token.href) {
          return `<a href="${token.href}">${escapeHtml(token.value)}</a>`;
        }
        const escaped = escapeHtml(token.value);
        return escaped.replace(/\*\*([^*]+)\*\*/g, (_match, boldText) => `<strong>${boldText}</strong>`);
      }).join("").replace(/\r?\n/g, "<br>");
    }

    function priorityLevel(value) {
      const clean = normalize(value);
      if (["high", "urgent", "critical", "highpriority"].includes(clean)) return "high";
      if (["medium", "normal", "moderate", "mediumpriority"].includes(clean)) return "medium";
      if (["low", "lowpriority"].includes(clean)) return "low";
      return "";
    }

    function detailClass(detail) {
      if (normalize(detail.label) !== "priority") return "q-detail";
      const level = priorityLevel(detail.value);
      return ["q-detail", "priority", level ? "priority-" + level : ""].filter(Boolean).join(" ");
    }

    function itemPriorityClass(item) {
      const priority = (item.extras || []).find(detail => normalize(detail.label) === "priority");
      const level = priority ? priorityLevel(priority.value) : "";
      return level ? "priority-" + level : "";
    }

    function detailValue(item, names) {
      const cleanNames = names.map(normalize);
      const detail = (item.extras || []).find(extra => cleanNames.includes(normalize(extra.label)));
      return detail ? String(detail.value || "").trim() : "";
    }

    function itemPriority(item) {
      return detailValue(item, ["priority"]);
    }

    function itemPriorityFilterValue(item) {
      const value = itemPriority(item);
      return priorityLevel(value) || normalize(value);
    }

    function itemAssignedTo(item) {
      return detailValue(item, ["assigned to", "assigned", "owner"]);
    }

    function uniqueOptions(getter) {
      const seen = new Set();
      return rows.reduce((options, item) => {
        const label = String(getter(item) || "").trim();
        const value = normalize(label);
        if (!label || seen.has(value)) return options;
        seen.add(value);
        options.push({ label, value });
        return options;
      }, []).sort((a, b) => a.label.localeCompare(b.label));
    }

    function priorityOptions() {
      const found = new Map();
      rows.forEach(item => {
        const text = itemPriority(item);
        const key = priorityLevel(text) || normalize(text);
        if (!key || found.has(key)) return;
        const label = priorityLevel(text) ? key.charAt(0).toUpperCase() + key.slice(1) : text;
        found.set(key, { label, value: key });
      });
      const ordered = ["high", "medium", "low"].filter(key => found.has(key)).map(key => found.get(key));
      const custom = [...found.values()].filter(option => !["high", "medium", "low"].includes(option.value));
      return ordered.concat(custom.sort((a, b) => a.label.localeCompare(b.label)));
    }

    function setSelectOptions(select, options, allLabel, currentValue) {
      const available = new Set(options.map(option => option.value));
      const nextValue = available.has(currentValue) ? currentValue : "";
      select.innerHTML = `<option value="">${escapeHtml(allLabel)}</option>` + options
        .map(option => `<option value="${escapeHtml(option.value)}">${escapeHtml(option.label)}</option>`)
        .join("");
      select.value = nextValue;
      return nextValue;
    }

    function updateFilterOptions() {
      priorityFilter = setSelectOptions(priorityFilterEl, priorityOptions(), "All priorities", priorityFilter);
      assignedFilter = setSelectOptions(assignedFilterEl, uniqueOptions(itemAssignedTo), "Everyone", assignedFilter);
    }

    function renderExtraDetails(details) {
      if (!details || !details.length) return "";
      const detailHtml = details.map(detail => {
        const valueHtml = formatDetailValue(detail.value);
        const imagesHtml = renderImagePreviews(detail.value, detail.label);
        return `
          <span class="${detailClass(detail)}">
            <span class="q-detail-label">${escapeHtml(detail.label)}</span>
            <span class="q-detail-value">${valueHtml}</span>
            ${imagesHtml}
          </span>
        `;
      }).join("");
      return `<span class="q-details">${detailHtml}</span>`;
    }

    function itemDone(item) {
      return usingSheet ? item.complete : Boolean(localState[item.id]);
    }

    function itemStatus(item) {
      if (usingSheet) return item.status || "Pending";
      return itemDone(item) ? "Complete" : "Pending";
    }

    function itemStatusClass(item) {
      return normalize(itemStatus(item)) || "pending";
    }

    function apiReady() {
      return /^https:\/\/script\.google\.com\//.test(sheetApiUrl);
    }

    function setAdminMode(enabled) {
      adminMode = enabled;
      adminPanel.classList.toggle("show", adminMode);
      adminToggle.textContent = adminMode ? "Exit edit" : "Admin edit";
      adminToggle.classList.toggle("active", adminMode);
      adminState.textContent = apiReady() ? "Admin editing is on." : "Editing is not connected yet.";
      render();
    }

    function requireAdminKey() {
      if (!apiReady()) {
        showToast("Editing is not connected yet");
        showNotice("Admin editing is not connected yet.");
        return false;
      }
      if (adminKey) return true;
      const key = prompt("Enter admin key");
      if (!key) return false;
      adminKey = key.trim();
      sessionStorage.setItem(ADMIN_KEY_STORAGE, adminKey);
      return true;
    }

    async function saveToSheet(payload) {
      if (!requireAdminKey()) throw new Error("Admin key is required.");
      await fetch(sheetApiUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ ...payload, key: adminKey })
      });
      await new Promise(resolve => setTimeout(resolve, 1800));
      return { ok: true };
    }

    function headersForEditing() {
      const headers = currentHeaders.length ? currentHeaders.slice() : DEFAULT_HEADERS.slice();
      DEFAULT_HEADERS.forEach(header => {
        if (!headers.some(existing => normalize(existing) === normalize(header))) headers.push(header);
      });
      return headers;
    }

    function valueForHeader(item, header) {
      const headers = headersForEditing();
      const index = headers.findIndex(existing => normalize(existing) === normalize(header));
      if (item && Array.isArray(item.values) && index >= 0) return item.values[index] || "";
      if (!item) {
        if (normalize(header) === "status") return "Pending";
        if (normalize(header) === "linklabel") return "View document";
      }
      return "";
    }

    function fieldOptions(header) {
      const clean = normalize(header);
      if (clean === "status") return ["Pending", "In Progress", "Waiting for Document", "Blocked", "Complete"];
      if (clean === "priority") return ["", "High", "Medium", "Low"];
      return null;
    }

    function isWideField(header) {
      return ["note", "notes", "description", "details", "documentlink", "link"].includes(normalize(header));
    }

    function renderEditField(header, value) {
      const fieldId = "field-" + normalize(header);
      const options = fieldOptions(header);
      if (options) {
        const allOptions = value && !options.includes(value) ? [value, ...options] : options;
        return `
          <div class="field">
            <label for="${fieldId}">${escapeHtml(header)}</label>
            <select id="${fieldId}" data-header="${escapeHtml(header)}">
              ${allOptions.map(option => `<option value="${escapeHtml(option)}" ${option === value ? "selected" : ""}>${escapeHtml(option || "No priority")}</option>`).join("")}
            </select>
          </div>
        `;
      }
      const tag = isWideField(header) ? "textarea" : "input";
      const wide = isWideField(header) ? " wide" : "";
      if (tag === "textarea") {
        return `
          <div class="field${wide}">
            <label for="${fieldId}">${escapeHtml(header)}</label>
            <textarea id="${fieldId}" data-header="${escapeHtml(header)}">${escapeHtml(value)}</textarea>
          </div>
        `;
      }
      return `
        <div class="field${wide}">
          <label for="${fieldId}">${escapeHtml(header)}</label>
          <input id="${fieldId}" data-header="${escapeHtml(header)}" value="${escapeHtml(value)}">
        </div>
      `;
    }

    function openEditor(item, preset = {}) {
      if (!requireAdminKey()) return;
      editingItem = item || null;
      const headers = headersForEditing();
      editTitle.textContent = item ? "Edit task" : "Add task";
      editFields.innerHTML = headers.map(header => {
        const presetKey = Object.keys(preset).find(key => normalize(key) === normalize(header));
        const value = presetKey ? preset[presetKey] : valueForHeader(item, header);
        return renderEditField(header, String(value || ""));
      }).join("");
      editModal.classList.remove("hidden");
    }

    function closeEditor() {
      editModal.classList.add("hidden");
      editingItem = null;
      editFields.innerHTML = "";
    }

    function collectEditValues() {
      const values = {};
      editFields.querySelectorAll("[data-header]").forEach(field => {
        values[field.dataset.header] = field.value;
      });
      return values;
    }

    async function submitEditor(event) {
      event.preventDefault();
      const values = collectEditValues();
      const action = editingItem ? "updateRow" : "addRow";
      const payload = editingItem
        ? { action, rowNumber: editingItem.sheetRow, values }
        : { action, values };
      if (editingItem && !editingItem.sheetRow) {
        showToast("Row number missing");
        return;
      }
      document.getElementById("saveEdit").disabled = true;
      try {
        await saveToSheet(payload);
        closeEditor();
        showToast("Saved");
        loadGoogleSheet();
      } catch (error) {
        showToast("Save failed");
        showNotice(error.message);
      } finally {
        document.getElementById("saveEdit").disabled = false;
      }
    }

    async function addColumn() {
      if (!requireAdminKey()) return;
      const name = prompt("New column name");
      if (!name || !name.trim()) return;
      try {
        await saveToSheet({ action: "addColumn", header: name.trim() });
        showToast("Column added");
        loadGoogleSheet();
      } catch (error) {
        showToast("Save failed");
        showNotice(error.message);
      }
    }

    function render() {
      sectionsEl.innerHTML = "";
      updateFilterOptions();
      adminPanel.classList.toggle("show", adminMode);
      adminToggle.textContent = adminMode ? "Exit edit" : "Admin edit";
      adminToggle.classList.toggle("active", adminMode);
      const completeCount = rows.filter(itemDone).length;
      const percent = rows.length ? Math.round((completeCount / rows.length) * 100) : 0;
      progressText.textContent = percent + "%";
      progressCount.textContent = completeCount + " of " + rows.length + " complete";
      progressBar.style.width = percent + "%";
      resetButton.style.display = usingSheet ? "none" : "";

      groupRows(rows).forEach(group => {
        const total = group.tasks.length;
        const done = group.tasks.filter(itemDone).length;
        const visibleTasks = group.tasks.filter(item => {
          if (filter === "complete" && !itemDone(item)) return false;
          if (filter === "pending" && itemDone(item)) return false;
          if (priorityFilter && itemPriorityFilterValue(item) !== priorityFilter) return false;
          if (assignedFilter && normalize(itemAssignedTo(item)) !== assignedFilter) return false;
          return true;
        });

        const sectionEl = document.createElement("section");
        const key = sectionKey(group.name);
        const collapsed = isSectionCollapsed(key);
        sectionEl.className = "section" + (done === total ? " done" : "");
        sectionEl.classList.toggle("collapsed", collapsed);
        if (visibleTasks.length === 0) sectionEl.classList.add("hidden");
        sectionEl.innerHTML = `
          <button class="section-head" data-section-toggle="${escapeHtml(key)}" type="button" aria-expanded="${String(!collapsed)}">
            <span>
              <span class="section-title-line">
                <span class="section-chevron" aria-hidden="true"></span>
                <h2>${escapeHtml(group.name)}</h2>
              </span>
              <span class="section-count">${done}/${total} complete</span>
            </span>
          </button>
        `;
        const tasksEl = document.createElement("div");
        tasksEl.className = "section-tasks";

        visibleTasks.forEach(item => {
          const doneNow = itemDone(item);
          const docUrl = safeUrl(item.link);
          const row = document.createElement("div");
          row.className = ["question", doneNow ? "complete" : "", itemPriorityClass(item)].filter(Boolean).join(" ");
          row.innerHTML = `
            <span class="box ${usingSheet ? "readonly" : ""}">
              <input type="checkbox" ${doneNow ? "checked" : ""} ${usingSheet ? "disabled" : ""} aria-label="${escapeHtml(item.task)}">
              <span class="tick">&#10003;</span>
            </span>
            <span>
              <p class="q-title">${escapeHtml(item.task)}</p>
              ${item.note ? `<p class="q-note">${escapeHtml(item.note)}</p>` : ""}
              ${renderExtraDetails(item.extras)}
              ${docUrl ? `<a class="doc-button active" href="${docUrl}" target="_blank" rel="noopener">${escapeHtml(item.linkLabel)}</a>` : `<span class="doc-button disabled" aria-disabled="true">${escapeHtml(item.linkLabel)}</span>`}
            </span>
            <span class="status ${itemStatusClass(item)}">${itemStatus(item)}</span>
            ${adminMode ? `<span class="edit-row"><button class="edit-button" data-edit-id="${escapeHtml(item.id)}" type="button">Edit item</button></span>` : ""}
          `;

          if (!usingSheet) {
            row.querySelector("input").addEventListener("change", event => {
              localState[item.id] = event.target.checked;
              if (!localState[item.id]) delete localState[item.id];
              saveLocalState();
              render();
            });
          }

          const editButton = row.querySelector("[data-edit-id]");
          if (editButton) {
            editButton.addEventListener("click", () => openEditor(item));
          }

          tasksEl.appendChild(row);
        });

        sectionEl.querySelector("[data-section-toggle]").addEventListener("click", () => {
          collapsedSections[key] = !isSectionCollapsed(key);
          saveCollapsedSections();
          render();
        });

        sectionEl.appendChild(tasksEl);
        sectionsEl.appendChild(sectionEl);
      });
    }

    function showNotice(message) {
      notice.textContent = message;
      notice.classList.toggle("show", Boolean(message));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function loadGoogleSheet() {
      if (!usingSheet) {
        currentHeaders = DEFAULT_HEADERS.slice();
        rows = rowsToItems(FALLBACK_ROWS);
        showNotice("");
        render();
        return;
      }

      showNotice("");
      const callback = "__fresheraSheet_" + Date.now();
      const script = document.createElement("script");
      const timeout = setTimeout(() => {
        cleanup();
        showNotice("Could not load the latest updates. Please refresh again.");
        currentHeaders = DEFAULT_HEADERS.slice();
        rows = rowsToItems(FALLBACK_ROWS);
        render();
      }, 12000);

      function cleanup() {
        clearTimeout(timeout);
        delete window[callback];
        script.remove();
      }

      window[callback] = response => {
        try {
          cleanup();
          if (response.status === "error") {
            throw new Error(response.errors?.map(error => error.detailed_message || error.message).join(" ") || "Could not load data.");
          }
          const table = response.table;
          if (!table || !Array.isArray(table.rows)) {
            throw new Error("Could not load table data.");
          }
          const cellText = cell => cell ? (cell.f || cell.v || "") : "";
          let headerLabels = table.cols.map((col, index) => String(col.label || "").trim() || "Column " + (index + 1));
          let headers = headerLabels.map(normalize);
          let dataRows = table.rows;
          const indexOf = names => {
            const cleanNames = names.map(normalize);
            return headers.findIndex(header => cleanNames.includes(header));
          };
          let idx = {
            section: indexOf(["section", "area", "category"]),
            task: indexOf(["task", "item", "todo", "title", "work"]),
            note: indexOf(["note", "description", "details"]),
            status: indexOf(["status", "complete", "done", "completed"]),
            link: indexOf(["document link", "doc link", "drive link", "evidence link", "link"]),
            label: indexOf(["link label", "document label", "doc label"])
          };

          if (idx.task < 0 && table.rows.length) {
            headerLabels = (table.rows[0].c || []).map((cell, index) => String(cellText(cell)).trim() || "Column " + (index + 1));
            headers = headerLabels.map(normalize);
            idx = {
              section: indexOf(["section", "area", "category"]),
              task: indexOf(["task", "item", "todo", "title", "work"]),
              note: indexOf(["note", "description", "details"]),
              status: indexOf(["status", "complete", "done", "completed"]),
              link: indexOf(["document link", "doc link", "drive link", "evidence link", "link"]),
              label: indexOf(["link label", "document label", "doc label"])
            };
            dataRows = table.rows.slice(1);
          }

          if (idx.section < 0 || idx.task < 0 || idx.status < 0) {
            throw new Error("Required columns were not found.");
          }

          currentHeaders = headerLabels.slice();
          const coreColumns = new Set(Object.values(idx).filter(index => index >= 0));
          const rawRows = dataRows.map((row, rowIndex) => {
            const cells = row.c || [];
            const value = cellIndex => {
              if (cellIndex < 0) return "";
              return cellText(cells[cellIndex]);
            };
            const values = headerLabels.map((_label, columnIndex) => String(cellText(cells[columnIndex]) || ""));
            const extras = headerLabels
              .map((label, columnIndex) => {
                if (coreColumns.has(columnIndex)) return null;
                const text = String(cellText(cells[columnIndex]) || "").trim();
                return label && text ? { label, value: text } : null;
              })
              .filter(Boolean);
            return {
              section: value(idx.section),
              task: value(idx.task),
              note: value(idx.note),
              status: value(idx.status),
              link: value(idx.link),
              linkLabel: value(idx.label),
              sheetRow: rowIndex + 2,
              values,
              extras
            };
          });

          rows = rowsToItems(rawRows);
          showNotice(rows.length ? "" : "No task rows were found.");
          render();
        } catch (error) {
          cleanup();
          showNotice("Data format mismatch. Keep these required columns: Section, Task, Status. Extra columns are shown automatically.");
          currentHeaders = DEFAULT_HEADERS.slice();
          rows = rowsToItems(FALLBACK_ROWS);
          render();
        }
      };

      const url = new URL("https://docs.google.com/spreadsheets/d/" + encodeURIComponent(sheetId) + "/gviz/tq");
      url.searchParams.set("sheet", sheetTab);
      url.searchParams.set("tqx", "responseHandler:" + callback);
      script.src = url.toString();
      script.onerror = () => {
        cleanup();
        showNotice("Could not access the latest updates. Please refresh again.");
        currentHeaders = DEFAULT_HEADERS.slice();
        rows = rowsToItems(FALLBACK_ROWS);
        render();
      };
      document.head.appendChild(script);
    }

    document.querySelectorAll("[data-filter]").forEach(button => {
      button.addEventListener("click", () => {
        filter = button.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach(btn => btn.classList.toggle("active", btn === button));
        render();
      });
    });

    priorityFilterEl.addEventListener("change", () => {
      priorityFilter = priorityFilterEl.value;
      render();
    });

    assignedFilterEl.addEventListener("change", () => {
      assignedFilter = assignedFilterEl.value;
      render();
    });

    document.getElementById("resetAll").addEventListener("click", () => {
      localState = {};
      saveLocalState();
      history.replaceState(null, "", location.pathname);
      render();
      showToast("Reset done");
    });

    document.getElementById("refreshData").addEventListener("click", () => {
      loadGoogleSheet();
    });

    adminToggle.addEventListener("click", () => {
      if (adminMode) {
        adminKey = "";
        sessionStorage.removeItem(ADMIN_KEY_STORAGE);
        setAdminMode(false);
        showToast("Edit mode off");
        return;
      }
      if (!requireAdminKey()) return;
      setAdminMode(true);
      showToast("Edit mode on");
    });

    document.getElementById("addTask").addEventListener("click", () => openEditor(null));
    document.getElementById("addSection").addEventListener("click", () => {
      if (!requireAdminKey()) return;
      const section = prompt("New section name");
      if (!section || !section.trim()) return;
      openEditor(null, { Section: section.trim(), Status: "Pending", "Link Label": "View document" });
    });
    document.getElementById("addColumn").addEventListener("click", addColumn);
    editForm.addEventListener("submit", submitEditor);
    document.getElementById("closeEdit").addEventListener("click", closeEditor);
    document.getElementById("cancelEdit").addEventListener("click", closeEditor);
    editModal.addEventListener("click", event => {
      if (event.target === editModal) closeEditor();
    });

    loadGoogleSheet();
  </script>
</body>
</html>
